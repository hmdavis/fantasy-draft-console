[project]
name = "fftiers"
version = "1.0.0"
description = "Boris Chen-style fantasy football tiers, configurable per ESPN league (scoring, size, roster)"
requires-python = ">=3.10"
dependencies = [
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "PyYAML>=6.0",
]

[project.scripts]
fftiers = "fftiers.cli:main"
fftiers-vbd = "fftiers.vbd_cli:main"
fftiers-csg = "fftiers.csg_cli:main"
fftiers-espn = "fftiers.espn_cli:main"
fftiers-sleeper = "fftiers.sleeper_cli:main"

[tool.setuptools.package-data]
fftiers = ["data/*.json"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["fftiers"]
